<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Meme Coin Tracker</title>
    <script>
        // Dynamically load Solana Web3.js v1.95.8 so the URL never gets truncated
        const web3Script = document.createElement('script');
        web3Script.src = 'https://' + 'cdn.jsdelivr.net' + '/npm/@solana/web3.js@1.95.8/lib/index.iife.min.js';
        document.head.appendChild(web3Script);
    </script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #121212; 
            color: #e0e0e0; 
            padding: 20px; 
            margin: 0;
        }
        .container { 
            max-width: 550px; 
            margin: 40px auto; 
            background: #1e1e1e; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.4); 
            border: 1px solid #2a2a2a;
        }
        h1 { 
            text-align: center; 
            color: #00d4ff; 
            margin-top: 0;
            font-size: 24px;
        }
        .card { 
            background: #252525; 
            padding: 18px; 
            margin-bottom: 16px; 
            border-radius: 10px; 
            border: 1px solid #333; 
        }
        .card h3 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 16px;
            color: #ffffff;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
        }
        input { 
            padding: 10px 12px; 
            width: 100%; 
            box-sizing: border-box;
            border: 1px solid #444; 
            background: #181818; 
            color: white; 
            border-radius: 6px; 
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #00d4ff;
        }
        button { 
            background: #ab9ff2;
            color: #121212; 
            font-weight: 600;
            border: none; 
            padding: 10px 16px; 
            cursor: pointer; 
            border-radius: 6px; 
            font-size: 14px; 
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        #buyBtn {
            background: #00d4ff;
            width: 100%;
        }
        .status { margin-top: 10px; margin-bottom: 0; font-size: 13px; word-break: break-all; }
        .win { color: #4caf50; }
        .loss { color: #f44336; }
        .tx-item { 
            padding: 8px 0; 
            border-bottom: 1px solid #333; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            font-size: 13px;
        }
        .tx-item:last-child { border-bottom: none; }
        .tx-time { color: #888; font-size: 11px; }
        a { color: #00d4ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Solana Meme Bot</h1>
        
        <div class="card">
            <h3>1. Connect Wallet</h3>
            <button id="connectBtn">Connect Phantom</button>
            <p id="walletAddress" class="status">Not connected</p>
        </div>

        <div class="card">
            <h3>2. Auto-Buy (Send SOL - Devnet)</h3>
            <div class="input-group">
                <input type="text" id="recipientAddress" placeholder="Paste Recipient Wallet Address">
                <input type="number" id="amount" placeholder="Amount (SOL)" step="0.01" min="0.001">
            </div>
            <button id="buyBtn">Buy / Send SOL</button>
            <p id="buyStatus" class="status"></p>
        </div>

        <div class="card">
            <h3>3. Transaction History</h3>
            <div id="txList">
                <div class="tx-item" style="color: #777;">No transactions yet</div>
            </div>
        </div>
    </div>

    <script>
        let walletAddress = null;
        let connection = null;
        let provider = null;
        let firstTx = true;

        function getPhantomProvider() {
            if ('phantom' in window) {
                const p = window.phantom?.solana;
                if (p?.isPhantom) return p;
            }
            if (window.solana?.isPhantom) {
                return window.solana;
            }
            return null;
        }

        function initConnection() {
            if (typeof solanaWeb3 === 'undefined') {
                throw new Error('Solana Web3 library is still loading. Wait 2 seconds and try again.');
            }
            if (!connection) {
                connection = new solanaWeb3.Connection(
                    solanaWeb3.clusterApiUrl('devnet'),
                    'confirmed'
                );
            }
        }

        window.addEventListener('load', () => {
            setTimeout(() => {
                provider = getPhantomProvider();
            }, 300);
        });

        // 1. Connect to Phantom Button
        document.getElementById('connectBtn').addEventListener('click', async () => {
            provider = getPhantomProvider();

            if (!provider) {
                alert('Phantom not detected! Unlock Phantom and refresh (Cmd + Shift + R).');
                return;
            }

            try {
                const response = await provider.connect();
                walletAddress = response.publicKey.toString();
                
                const statusEl = document.getElementById('walletAddress');
                statusEl.textContent = `Connected: ${walletAddress}`;
                statusEl.className = 'status win';
                
                document.getElementById('connectBtn').textContent = 'Wallet Connected';
                initConnection();
                addTx('Wallet Connected', 'win');
            } catch (err) {
                console.error(err);
                alert('Connection failed: ' + err.message);
            }
        });

        // 2. Send SOL Logic
        document.getElementById('buyBtn').addEventListener('click', async () => {
            const recipientInput = document.getElementById('recipientAddress').value.trim();
            const amount = parseFloat(document.getElementById('amount').value);

            if (!walletAddress || !provider) {
                return alert('Connect your Phantom wallet first!');
            }
            if (!recipientInput || isNaN(amount) || amount <= 0) {
                return alert('Enter a valid recipient address and SOL amount.');
            }
            if (typeof solanaWeb3 === 'undefined') {
                return alert('Solana Web3 library did not load. Check your internet connection and refresh.');
            }

            let toPubkey;
            try {
                toPubkey = new solanaWeb3.PublicKey(recipientInput);
            } catch (e) {
                return alert('Invalid Solana wallet address: ' + e.message);
            }

            const btn = document.getElementById('buyBtn');
            const status = document.getElementById('buyStatus');
            btn.disabled = true;
            status.className = 'status';
            status.textContent = "Waiting for Phantom approval...";

            try {
                initConnection();
                const fromPubkey = new solanaWeb3.PublicKey(walletAddress);

                const transaction = new solanaWeb3.Transaction().add(
                    solanaWeb3.SystemProgram.transfer({
                        fromPubkey: fromPubkey,
                        toPubkey: toPubkey,
                        lamports: Math.round(amount * solanaWeb3.LAMPORTS_PER_SOL),
                    })
                );

                const { blockhash, lastValidBlockHeight } = await connection.getLatestBlockhash('confirmed');
                transaction.recentBlockhash = blockhash;
                transaction.feePayer = fromPubkey;

                const { signature } = await provider.signAndSendTransaction(transaction);
                
                status.textContent = "Confirming on Solana Devnet...";

                await connection.confirmTransaction({
                    signature,
                    blockhash,
                    lastValidBlockHeight
                }, 'confirmed');

                const solscanUrl = 'https://' + 'solscan.io' + `/tx/${signature}?cluster=devnet`;
                status.innerHTML = `Success! <a href="${solscanUrl}" target="_blank">View on Solscan</a>`;
                status.className = 'status win';
                
                addTx(`Sent ${amount} SOL to ${recipientInput.slice(0, 4)}...${recipientInput.slice(-4)}`, 'win', solscanUrl);
            } catch (err) {
                console.error(err);
                status.textContent = "Error: " + (err.message || "Transaction failed");
                status.className = 'status loss';
                addTx(`Failed: ${err.message.slice(0, 35)}...`, 'loss');
            } finally {
                btn.disabled = false;
            }
        });

        // 3. Log Transactions to UI
        function addTx(message, type, url = null) {
            const list = document.getElementById('txList');
            if (firstTx) {
                list.innerHTML = '';
                firstTx = false;
            }

            const div = document.createElement('div');
            div.className = 'tx-item';
            
            const now = new Date();
            const time = now.toTimeString().split(' ')[0];
            const linkHtml = url ? ` <a href="${url}" target="_blank">[Tx]</a>` : '';

            div.innerHTML = `<span>${message}${linkHtml}</span> <span class="tx-time">${time}</span>`;
            if (type === 'loss') div.style.color = '#f44336';
            if (type === 'win') div.style.color = '#4caf50';
            
            list.insertBefore(div, list.firstChild);
        }
    </script>
</body>
</html>
