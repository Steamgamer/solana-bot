<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Solana Meme Coin Sniper</title>
    <script>
        // 1. Load Buffer polyfill first
        const bufferScript = document.createElement('script');
        bufferScript.src = 'https://' + 'bundle.run' + '/buffer@6.0.3';
        bufferScript.onload = () => {
            window.Buffer = window.buffer.Buffer;
            // 2. Load Solana Web3.js v1.95.8 after Buffer is ready
            const web3Script = document.createElement('script');
            web3Script.src = 'https://' + 'cdn.jsdelivr.net' + '/npm/@solana/web3.js@1.95.8/lib/index.iife.min.js';
            document.head.appendChild(web3Script);
        };
        document.head.appendChild(bufferScript);
    </script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #121212; 
            color: #e0e0e0; 
            padding: 15px; 
            margin: 0;
        }
        .container { 
            max-width: 550px; 
            margin: 15px auto; 
            background: #1e1e1e; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.4); 
            border: 1px solid #2a2a2a;
        }
        h1 { 
            text-align: center; 
            color: #00d4ff; 
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 22px;
        }
        .network-badge {
            text-align: center;
            font-size: 11px;
            color: #4caf50;
            margin-bottom: 18px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .card { 
            background: #252525; 
            padding: 16px; 
            margin-bottom: 14px; 
            border-radius: 10px; 
            border: 1px solid #333; 
        }
        .card h3 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 15px;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .balance-tag {
            background: #181818;
            color: #00d4ff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
            border: 1px solid #333;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
        }
        .row {
            display: flex;
            gap: 10px;
        }
        input, select { 
            padding: 12px; 
            width: 100%; 
            box-sizing: border-box;
            border: 1px solid #444; 
            background: #181818; 
            color: white; 
            border-radius: 6px; 
            font-size: 16px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #00d4ff;
        }
        button { 
            background: #ab9ff2;
            color: #121212; 
            font-weight: 600;
            border: none; 
            padding: 12px 16px; 
            cursor: pointer; 
            border-radius: 6px; 
            font-size: 15px; 
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        #buyBtn {
            background: #00d4ff;
            width: 100%;
            font-size: 16px;
        }
        .refresh-btn {
            background: #333;
            color: #ccc;
            padding: 6px 10px;
            font-size: 12px;
            margin-left: 6px;
        }
        .status { margin-top: 10px; margin-bottom: 0; font-size: 13px; word-break: break-all; }
        .win { color: #4caf50; }
        .loss { color: #f44336; }
        .tx-item { 
            padding: 8px 0; 
            border-bottom: 1px solid #333; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            font-size: 13px;
        }
        .tx-item:last-child { border-bottom: none; }
        .tx-time { color: #888; font-size: 11px; }
        a { color: #00d4ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Solana Meme Bot</h1>
        <div class="network-badge">● MAINNET LIVE</div>
        
        <div class="card">
            <h3>
                <span>1. Connect Wallet</span>
                <span id="solBalance" class="balance-tag" style="display:none;">Loading SOL...</span>
            </h3>
            <button id="connectBtn">Connect Phantom</button>
            <button id="refreshBalBtn" class="refresh-btn" style="display:none;">↻ Refresh</button>
            <p id="walletAddress" class="status">Not connected</p>
        </div>

        <div class="card">
            <h3>2. Buy Meme Coin (Jupiter Swap)</h3>
            <div class="input-group">
                <input type="text" id="tokenMint" placeholder="Paste Token Mint Address (CA)">
                <div class="row">
                    <input type="number" id="amount" placeholder="SOL Amount (e.g. 0.01)" step="0.005" min="0.001">
                    <select id="slippage">
                        <option value="100">1% Slippage</option>
                        <option value="300" selected>3% Slippage</option>
                        <option value="500">5% Slippage</option>
                        <option value="1000">10% Slippage</option>
                    </select>
                </div>
            </div>
            <button id="buyBtn">Swap SOL → Token</button>
            <p id="buyStatus" class="status"></p>
        </div>

        <div class="card">
            <h3>3. Transaction History</h3>
            <div id="txList">
                <div class="tx-item" style="color: #777;">No transactions yet</div>
            </div>
        </div>
    </div>

    <script>
        // Full Mainnet RPC Endpoints (Primary + Backup)
        const RPC_ENDPOINTS = [
            'https://' + 'solana-rpc' + '.publicnode.com',
            'https://' + 'rpc.ankr' + '.com/solana'
        ];
        const WSOL_MINT = 'So11111111111111111111111111111111111111112';
        const JUP_QUOTE_URL = 'https://' + 'quote-api' + '.jup.ag/v6/quote';
        const JUP_SWAP_URL = 'https://' + 'quote-api' + '.jup.ag/v6/swap';

        let walletAddress = null;
        let connection = null;
        let provider = null;
        let firstTx = true;

        function isMobileDevice() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }

        function getPhantomProvider() {
            if ('phantom' in window) {
                const p = window.phantom?.solana;
                if (p?.isPhantom) return p;
            }
            if (window.solana?.isPhantom) return window.solana;
            return null;
        }

        function initConnection(rpcIndex = 0) {
            if (typeof solanaWeb3 === 'undefined') {
                throw new Error('Solana Web3 library is still loading. Wait 2 seconds and try again.');
            }
            connection = new solanaWeb3.Connection(RPC_ENDPOINTS[rpcIndex], 'confirmed');
        }

        async function updateBalance() {
            if (!walletAddress) return;
            const balEl = document.getElementById('solBalance');
            balEl.style.display = 'inline-block';
            balEl.textContent = 'Updating...';
            document.getElementById('refreshBalBtn').style.display = 'inline-block';

            for (let i = 0; i < RPC_ENDPOINTS.length; i++) {
                try {
                    if (!connection || i > 0) initConnection(i);
                    const pubkey = new solanaWeb3.PublicKey(walletAddress);
                    const lamports = await connection.getBalance(pubkey);
                    const sol = (lamports / solanaWeb3.LAMPORTS_PER_SOL).toFixed(4);
                    balEl.textContent = `${sol} SOL`;
                    return;
                } catch (err) {
                    console.warn(`RPC ${i} balance check failed, trying backup...`, err);
                }
            }
            balEl.textContent = 'RPC Busy (Tap ↻)';
        }

        window.addEventListener('load', () => {
            setTimeout(() => {
                provider = getPhantomProvider();
                if (!provider && isMobileDevice()) {
                    document.getElementById('connectBtn').textContent = 'Open in Phantom App';
                }
            }, 300);
        });

        // 1. Connect Wallet
        document.getElementById('connectBtn').addEventListener('click', async () => {
            provider = getPhantomProvider();

            if (!provider) {
                if (isMobileDevice()) {
                    const currentUrl = encodeURIComponent(window.location.href);
                    const refUrl = encodeURIComponent(window.location.origin);
                    window.location.href = 'https://' + 'phantom.app' + `/ul/browse/${currentUrl}?ref=${refUrl}`;
                    return;
                } else {
                    alert('Phantom not detected! Unlock Phantom and refresh (Cmd + Shift + R).');
                    return;
                }
            }

            try {
                const response = await provider.connect();
                walletAddress = response.publicKey.toString();
                
                const statusEl = document.getElementById('walletAddress');
                statusEl.textContent = `Connected: ${walletAddress}`;
                statusEl.className = 'status win';
                
                document.getElementById('connectBtn').textContent = 'Wallet Connected';
                initConnection(0);
                await updateBalance();
                addTx('Connected to Mainnet', 'win');
            } catch (err) {
                console.error(err);
                alert('Connection failed: ' + err.message);
            }
        });

        document.getElementById('refreshBalBtn').addEventListener('click', updateBalance);

        // 2. Jupiter Swap (SOL -> Meme Coin)
        document.getElementById('buyBtn').addEventListener('click', async () => {
            const outputMint = document.getElementById('tokenMint').value.trim();
            const solAmount = parseFloat(document.getElementById('amount').value);
            const slippageBps = parseInt(document.getElementById('slippage').value, 10);

            if (!walletAddress || !provider) {
                return alert('Connect your Phantom wallet first!');
            }
            if (!outputMint || isNaN(solAmount) || solAmount <= 0) {
                return alert('Enter a valid Token Mint address (CA) and SOL amount.');
            }
            if (outputMint === WSOL_MINT) {
                return alert('Paste the Meme Coin Mint address, not Wrapped SOL.');
            }

            try {
                new solanaWeb3.PublicKey(outputMint);
            } catch (e) {
                return alert('Invalid Token Mint address format!');
            }

            const btn = document.getElementById('buyBtn');
            const status = document.getElementById('buyStatus');
            btn.disabled = true;
            status.className = 'status';
            status.textContent = '1/3 Fetching best route from Jupiter...';

            try {
                if (!connection) initConnection(0);
                const lamports = Math.round(solAmount * solanaWeb3.LAMPORTS_PER_SOL);

                const quoteRes = await fetch(
                    `${JUP_QUOTE_URL}?inputMint=${WSOL_MINT}&outputMint=${outputMint}&amount=${lamports}&slippageBps=${slippageBps}`
                );
                const quoteResponse = await quoteRes.json();

                if (!quoteRes.ok || quoteResponse.error) {
                    throw new Error(quoteResponse.error || 'No liquidity route found for this token');
                }

                status.textContent = '2/3 Building swap transaction...';
                const swapRes = await fetch(JUP_SWAP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        quoteResponse,
                        userPublicKey: walletAddress,
                        wrapAndUnwrapSol: true,
                        dynamicComputeUnitLimit: true,
                        prioritizationFeeLamports: 'auto'
                    })
                });
                const swapData = await swapRes.json();

                if (!swapRes.ok || !swapData.swapTransaction) {
                    throw new Error(swapData.error || 'Failed to build swap transaction');
                }

                const swapTransactionBuf = Buffer.from(swapData.swapTransaction, 'base64');
                const transaction = solanaWeb3.VersionedTransaction.deserialize(swapTransactionBuf);

                status.textContent = '3/3 Waiting for Phantom approval...';
                const { signature } = await provider.signAndSendTransaction(transaction);

                status.textContent = 'Confirming swap on Mainnet...';
                const latestBlockhash = await connection.getLatestBlockhash('confirmed');
                await connection.confirmTransaction({
                    signature,
                    blockhash: latestBlockhash.blockhash,
                    lastValidBlockHeight: latestBlockhash.lastValidBlockHeight
                }, 'confirmed');

                const solscanUrl = 'https://' + 'solscan.io' + `/tx/${signature}`;
                status.innerHTML = `Swap Confirmed! <a href="${solscanUrl}" target="_blank">View on Solscan</a>`;
                status.className = 'status win';

                addTx(`Bought ${outputMint.slice(0, 4)}...${outputMint.slice(-4)} (${solAmount} SOL)`, 'win', solscanUrl);
                await updateBalance();

            } catch (err) {
                console.error(err);
                status.textContent = 'Error: ' + (err.message || 'Swap failed');
                status.className = 'status loss';
                addTx(`Swap Failed: ${err.message.slice(0, 32)}...`, 'loss');
            } finally {
                btn.disabled = false;
            }
        });

        // 3. Log Transactions to UI
        function addTx(message, type, url = null) {
            const list = document.getElementById('txList');
            if (firstTx) {
                list.innerHTML = '';
                firstTx = false;
            }

            const div = document.createElement('div');
            div.className = 'tx-item';
            
            const time = new Date().toTimeString().split(' ')[0];
            const linkHtml = url ? ` <a href="${url}" target="_blank">[Tx]</a>` : '';

            div.innerHTML = `<span>${message}${linkHtml}</span> <span class="tx-time">${time}</span>`;
            if (type === 'loss') div.style.color = '#f44336';
            if (type === 'win') div.style.color = '#4caf50';
            
            list.insertBefore(div, list.firstChild);
        }
    </script>
</body>
</html>
